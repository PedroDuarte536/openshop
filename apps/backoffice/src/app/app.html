@if (api.token()) {
  <div class="shell">
    <aside class="side">
      <a class="brand" routerLink="/products"><i></i>OpenShop</a>
      <nav aria-label="Main">
        <a routerLink="/products" routerLinkActive="on">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10"/></svg>Products</a>
        <a routerLink="/categories" routerLinkActive="on">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Categories</a>
        <a routerLink="/orders" routerLinkActive="on">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l2 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><path d="M4 8h16M9 12h6"/></svg>Orders</a>
        <a routerLink="/pages" routerLinkActive="on">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 14h8"/></svg>Pages</a>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener">View your shop ↗</a>
        <button (click)="logout()">Sign out</button>
      </div>
    </aside>
    <main class="main"><router-outlet /></main>
  </div>
} @else {
  <router-outlet />
}
